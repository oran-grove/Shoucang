<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="../lib/layui-v2.6.3/css/layui.css" media="all">
    <link rel="stylesheet" href="../lib/font-awesome-4.7.0/css/font-awesome.min.css" media="all">
    <link rel="stylesheet" href="../css/public.css" media="all">
    <style>
        .layui-card {border:1px solid #f2f2f2;border-radius:5px;}

        /* ======== 系统状态卡片 ======== */
        .status-cards {display:flex; flex-wrap:wrap; gap:15px;}
        .status-cards .status-item {
            flex:1; min-width:200px; background:#fff; border-radius:6px;
            padding:20px 15px; box-shadow:0 1px 4px rgba(0,0,0,.06);
            display:flex; align-items:center; gap:15px; transition:box-shadow .3s;
        }
        .status-cards .status-item:hover {box-shadow:0 2px 12px rgba(0,0,0,.1);}
        .status-cards .status-icon {
            width:56px;height:56px;border-radius:50%;
            display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;flex-shrink:0;
        }
        .status-cards .status-info {flex:1;}
        .status-cards .status-title {font-size:13px;color:#999;margin-bottom:4px;}
        .status-cards .status-value {font-size:22px;font-weight:600;color:#333;}
        .status-cards .status-sub   {font-size:11px;color:#aaa;margin-top:2px;}
        .bg-green  {background:#5FB878;}
        .bg-blue   {background:#1E9FFF;}
        .bg-orange {background:#FFB800;}
        .bg-red    {background:#FF5722;}

        /* ======== 警告表格标签 ======== */
        .level-serious  {color:#fff;background:#FF5722;padding:2px 8px;border-radius:3px;font-size:12px;}
        .level-high     {color:#fff;background:#FF7844;padding:2px 8px;border-radius:3px;font-size:12px;}
        .level-mid      {color:#fff;background:#FFB800;padding:2px 8px;border-radius:3px;font-size:12px;}
        .level-low      {color:#fff;background:#5FB878;padding:2px 8px;border-radius:3px;font-size:12px;}
        .status-badge   {padding:2px 8px;border-radius:3px;font-size:12px;}
        .status-pending {color:#FF5722;background:#FFF0EC;}
        .status-doing   {color:#1E9FFF;background:#ECF5FF;}
        .status-done    {color:#5FB878;background:#EDFBF1;}
        .status-confirmed{color:#FFB800;background:#FFF9EC;}

        /* ======== IP 表格 ======== */
        .ip-segment {font-family:'Consolas','Monaco',monospace; font-size:14px;color:#1E9FFF;}

        @media screen and (max-width:768px) {
            .status-cards .status-item {min-width:45%;}
        }
    </style>
</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">

        <!-- ==================== 系统状态（CPU / RAM / UP / DOWN） ==================== -->
        <div class="layui-card">
            <div class="layui-card-header"><i class="fa fa-server icon" style="color:#1E9FFF;"></i>系统状态</div>
            <div class="layui-card-body">
                <div class="status-cards">
                    <div class="status-item">
                        <div class="status-icon bg-blue"><i class="fa fa-microchip"></i></div>
                        <div class="status-info">
                            <div class="status-title">CPU 使用率</div>
                            <div class="status-value" id="cpuVal">--%</div>
                            <div class="status-sub">实时监控</div>
                        </div>
                    </div>
                    <div class="status-item">
                        <div class="status-icon bg-green"><i class="fa fa-tasks"></i></div>
                        <div class="status-info">
                            <div class="status-title">RAM 使用率</div>
                            <div class="status-value" id="ramVal">--%</div>
                            <div class="status-sub">实时监控</div>
                        </div>
                    </div>
                    <div class="status-item">
                        <div class="status-icon bg-orange"><i class="fa fa-arrow-up"></i></div>
                        <div class="status-info">
                            <div class="status-title">上传速率（上行）</div>
                            <div class="status-value" id="upVal">--</div>
                            <div class="status-sub">上行带宽</div>
                        </div>
                    </div>
                    <div class="status-item">
                        <div class="status-icon bg-red"><i class="fa fa-arrow-down"></i></div>
                        <div class="status-info">
                            <div class="status-title">下载速率（下行）</div>
                            <div class="status-value" id="downVal">--</div>
                            <div class="status-sub">下行带宽</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    

        <!-- ==================== 高危险警告表格 ==================== -->
        <div class="layui-row layui-col-space15" style="margin-top:15px;">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-header">
                        <i class="fa fa-exclamation-triangle icon" style="color:#FF5722;"></i>高危险警告
                        <span style="float:right;font-weight:400;" id="warningCount">0 条</span>
                    </div>
                    <div class="layui-card-body" style="padding:0;">
                        <table class="layui-table" lay-skin="line" style="margin:0;">
                            <colgroup>
                                <col width="180">
                                <col width="120">
                                <col>
                            </colgroup>
                            <thead>
                                <tr>
                                    <th>来源 IP</th>
                                    <th>威胁等级</th>
                                    <th>原因</th>
                                </tr>
                            </thead>
                            <tbody id="warningTbody">
                                <tr><td colspan="3" style="text-align:center;color:#999;">正在加载…</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="../lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
<script src="../js/lay-config.js?v=1.0.4" charset="utf-8"></script>
<script>
layui.use(['layer', 'miniTab'], function () {
    var $ = layui.jquery,
        layer = layui.layer,
        miniTab = layui.miniTab;

    miniTab.listen();


    function formatBytes(bytes) {
        if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + ' GB/s';
        if (bytes >= 1048576)    return (bytes / 1048576).toFixed(2) + ' MB/s';
        if (bytes >= 1024)       return (bytes / 1024).toFixed(1) + ' KB/s';
        return bytes + ' B/s';
    }

    function showStatusError(msg) {
        $('#cpuVal').text('错误').css('color', '#FF5722');
        $('#ramVal').text('错误').css('color', '#FF5722');
        $('#upVal').text(msg || '错误').css('color', '#FF5722');
        $('#downVal').text('--').css('color', '#FF5722');
    }

    // ==================== 模块一：系统状态（localhost:5000） ====================
    function loadServerStatus() {
        $.ajax({
            url: 'http://127.0.0.1:5000/api/status',
            type: 'GET',
            dataType: 'json',
            timeout: 8000,
            success: function (res) {
                if (res.code === 200 && res.data) {
                    var d = res.data;
                    $('#cpuVal').text((d.cpu != null ? d.cpu : '--') + '%').css('color', '#333');
                    $('#ramVal').text(formatBytes(d.ram || 0)).css('color', '#333');
                    $('#upVal').text(formatBytes(d.up || 0)).css('color', '#333');
                    $('#downVal').text(formatBytes(d.down || 0)).css('color', '#333');
                } else {
                    showStatusError(res.message || '数据异常');
                }
            },
            error: function (xhr, status) {
                showStatusError(status === 'timeout' ? '请求超时' : '无法连接');
            }
        });
    }

    // ==================== 模块二：高危险警告（127.0.0.1:5000） ====================
    function renderWarnings(data) {
        var $tbody = $('#warningTbody');
        $('#warningCount').text(data.count + ' 条');
        if (!data.count) {
            $tbody.html('<tr><td colspan="3" style="text-align:center;color:#999;">暂无高危险警告</td></tr>');
            return;
        }
        var levelClass = { 'high': 'level-high', 'medium': 'level-mid', 'low': 'level-low' };
        var levelText  = { 'high': '高危', 'medium': '中危', 'low': '低危' };
        var rows = '';
        $.each(data.data, function (i, item) {
            var lcls = levelClass[item.threat_level] || 'level-mid';
            var ltxt = levelText[item.threat_level]  || item.threat_level;
            rows += '<tr data-id="' + (item.id || '') + '" style="cursor:pointer;">' +
                '<td><span class="ip-segment">' + (item.src_ip || '--') + '</span></td>' +
                '<td><span class="' + lcls + '">' + ltxt + '</span></td>' +
                '<td>' + (item.reason || '--') + '</td>' +
                '</tr>';
        });
        $tbody.html(rows);

        // 点击行跳转到详情页
        $tbody.find('tr[data-id]').on('click', function () {
            window.location.href = '/page/dealing_jobs.html';
        });
    }

    function loadDangerWarnings() {
        $.ajax({
            url: 'http://127.0.0.1:5000/api/traffic',
            type: 'GET',
            dataType: 'json',
            timeout: 10000,
            success: function (res) {
                if (res.code === '0' || res.code === 0) {
                    renderWarnings(res.data || []);
                } else {
                    $('#warningTbody').html('<tr><td colspan="3" style="text-align:center;color:#FF5722;">加载失败: ' + (res.msg || '未知错误') + '</td></tr>');
                }
            },
            error: function (xhr, status) {
                var msg = status === 'timeout' ? '请求超时' : '无法连接后端';
                $('#warningTbody').html('<tr><td colspan="3" style="text-align:center;color:#FF5722;">' + msg + '</td></tr>');
            }
        });
    }

    // ==================== 页面初始化 ====================
    loadServerStatus();
    loadDangerWarnings();

    // 每 30 秒自动刷新
    setInterval(loadServerStatus, 30000);
    setInterval(loadDangerWarnings, 30000);
});
</script>
</body>
</html>
