<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>layui</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="../lib/layui-v2.6.3/css/layui.css" media="all">
    <link rel="stylesheet" href="../css/public.css" media="all">
</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">

        <div>
            <div class="layui-row layui-col-space15" style="margin-bottom: 20px;">
                <div class="layui-col-md4">
                    <div class="ai-card" id="cardDeepSeek" style="cursor:pointer; padding:24px; border-radius:8px; text-align:center; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,0.08); transition: box-shadow .3s;">
                        <svg width="48" height="48" viewBox="0 0 48 48" style="margin-bottom:12px;">
                            <circle cx="24" cy="24" r="22" fill="#4F46E5" opacity="0.12"/>
                            <path d="M16 16 L24 8 L32 16 L28 16 L28 24 L32 24 L24 32 L16 24 L20 24 L20 16Z" fill="#4F46E5"/>
                        </svg>
                        <h3 style="margin:0 0 6px 0; font-size:16px; color:#333;">DeepSeek</h3>
                        <p style="margin:0; font-size:13px; color:#999;">DeepSeek API 配置</p>
                    </div>
                </div>
                <div class="layui-col-md4">
                    <div class="ai-card" id="cardLMStudio" style="cursor:pointer; padding:24px; border-radius:8px; text-align:center; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,0.08); transition: box-shadow .3s;">
                        <svg width="48" height="48" viewBox="0 0 48 48" style="margin-bottom:12px;">
                            <rect x="6" y="10" width="36" height="28" rx="4" fill="#7C3AED" opacity="0.12"/>
                            <rect x="10" y="14" width="12" height="8" rx="2" fill="#7C3AED"/>
                            <rect x="26" y="14" width="12" height="8" rx="2" fill="#7C3AED"/>
                            <rect x="10" y="26" width="8" height="8" rx="2" fill="#7C3AED"/>
                            <rect x="22" y="26" width="16" height="8" rx="2" fill="#7C3AED"/>
                        </svg>
                        <h3 style="margin:0 0 6px 0; font-size:16px; color:#333;">LM Studio</h3>
                        <p style="margin:0; font-size:13px; color:#999;">本地模型服务配置</p>
                    </div>
                </div>
                <div class="layui-col-md4">
                    <div class="ai-card" id="cardOpenAI" style="cursor:pointer; padding:24px; border-radius:8px; text-align:center; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,0.08); transition: box-shadow .3s;">
                        <svg width="48" height="48" viewBox="0 0 48 48" style="margin-bottom:12px;">
                            <circle cx="24" cy="24" r="22" fill="#10A37F" opacity="0.12"/>
                            <path d="M24 6 C20 14 16 18 8 20 C16 22 20 28 24 36 C28 28 32 22 40 20 C32 18 28 14 24 6Z" fill="#10A37F"/>
                        </svg>
                        <h3 style="margin:0 0 6px 0; font-size:16px; color:#333;">OpenAI</h3>
                        <p style="margin:0; font-size:13px; color:#999;">ChatGPT API 配置</p>
                    </div>
                </div>
            </div>
        </div>
        
        <blockquote class="layui-elem-quote layui-text">
        "请谨慎填写"
        </blockquote>

        <form class="layui-form" lay-filter="configForm">

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
            <legend>Detection — 检测配置</legend>
        </fieldset>

        <div class="layui-form-item">
            <label class="layui-form-label">backend</label>
            <div class="layui-input-block">
                <input type="text" name="detection[backend]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">model_name</label>
            <div class="layui-input-block">
                <input type="text" name="detection[model_name]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">temperature</label>
            <div class="layui-input-block">
                <input type="number" name="detection[temperature]" step="0.1" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">max_tokens</label>
            <div class="layui-input-block">
                <input type="number" name="detection[max_tokens]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">confidence_threshold_malicious</label>
            <div class="layui-input-block">
                <input type="number" name="detection[confidence_threshold_malicious]" step="0.01" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">confidence_threshold_suspect</label>
            <div class="layui-input-block">
                <input type="number" name="detection[confidence_threshold_suspect]" step="0.01" class="layui-input">
            </div>
        </div>

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
            <legend>Correlation — 关联配置</legend>
        </fieldset>

        <div class="layui-form-item">
            <label class="layui-form-label">backend</label>
            <div class="layui-input-block">
                <input type="text" name="correlation[backend]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">model_name</label>
            <div class="layui-input-block">
                <input type="text" name="correlation[model_name]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">temperature</label>
            <div class="layui-input-block">
                <input type="number" name="correlation[temperature]" step="0.1" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">max_tokens</label>
            <div class="layui-input-block">
                <input type="number" name="correlation[max_tokens]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">min_records_to_correlate</label>
            <div class="layui-input-block">
                <input type="number" name="correlation[min_records_to_correlate]" class="layui-input">
            </div>
        </div>

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
            <legend>Judgment — 判定配置</legend>
        </fieldset>

        <div class="layui-form-item">
            <label class="layui-form-label">backend</label>
            <div class="layui-input-block">
                <input type="text" name="judgment[backend]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">model_name</label>
            <div class="layui-input-block">
                <input type="text" name="judgment[model_name]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">temperature</label>
            <div class="layui-input-block">
                <input type="number" name="judgment[temperature]" step="0.1" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">max_tokens</label>
            <div class="layui-input-block">
                <input type="number" name="judgment[max_tokens]" class="layui-input">
            </div>
        </div>

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
            <legend>Feedback — 反馈配置</legend>
        </fieldset>

        <div class="layui-form-item">
            <label class="layui-form-label">backend</label>
            <div class="layui-input-block">
                <input type="text" name="feedback[backend]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">model_name</label>
            <div class="layui-input-block">
                <input type="text" name="feedback[model_name]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">temperature</label>
            <div class="layui-input-block">
                <input type="number" name="feedback[temperature]" step="0.1" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">max_tokens</label>
            <div class="layui-input-block">
                <input type="number" name="feedback[max_tokens]" class="layui-input">
            </div>
        </div>

        <div style="text-align:center; margin-top:30px; margin-bottom:20px;">
            <button class="layui-btn" lay-submit lay-filter="submitConfig">保存配置</button>
            <button class="layui-btn layui-btn-primary" id="btnResetConfig" type="button">默认配置</button>
        </div>

        </form>
        
    </div>
</div>

<script src="../lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
<!-- 注意：如果你直接复制所有代码到本地，上述js路径需要改成你本地的 -->
<script>
    layui.use(['form', 'layedit', 'laydate'], function () {
        var form = layui.form
            , layer = layui.layer
            , layedit = layui.layedit
            , laydate = layui.laydate;

        //日期
        laydate.render({
            elem: '#date'
        });
        laydate.render({
            elem: '#date1'
        });

        //创建一个编辑器
        var editIndex = layedit.build('LAY_demo_editor');

        //自定义验证规则
        form.verify({
            title: function (value) {
                if (value.length < 5) {
                    return '标题至少得5个字符啊';
                }
            }
            , pass: [
                /^[\S]{6,12}$/
                , '密码必须6到12位，且不能出现空格'
            ]
            , content: function (value) {
                layedit.sync(editIndex);
            }
        });

        //监听指定开关
        form.on('switch(switchTest)', function (data) {
            layer.msg('开关checked：' + (this.checked ? 'true' : 'false'), {
                offset: '6px'
            });
            layer.tips('温馨提示：请注意开关状态的文字可以随意定义，而不仅仅是ON|OFF', data.othis)
        });

        //监听提交
        form.on('submit(demo1)', function (data) {
            layer.alert(JSON.stringify(data.field), {
                title: '最终的提交信息'
            })
            return false;
        });

        var $ = layui.$;

        // 加载配置并填充表单
        $.getJSON('../api/get_config.php', function (config) {
            ['detection', 'correlation', 'judgment', 'feedback'].forEach(function (section) {
                var data = config[section];
                if (data) {
                    for (var key in data) {
                        $('input[name="' + section + '[' + key + ']"]').val(data[key]);
                    }
                }
            });
            form.render(null, 'configForm');
        }).fail(function () {
            layer.msg('加载配置失败', { icon: 2 });
        });

        // 卡片点击事件
        $('#cardDeepSeek').on('click', function () {
            layer.open({
                title: 'DeepSeek 配置',
                type: 2,
                shade: 0.2,
                maxmin: true,
                shadeClose: true,
                area: ['100%', '100%'],
                content: '../page/table/edit_deepseek.html'
            });
        });

        $('#cardLMStudio').on('click', function () {
            layer.open({
                title: 'LM Studio 配置',
                type: 2,
                shade: 0.2,
                maxmin: true,
                shadeClose: true,
                area: ['100%', '100%'],
                content: '../page/table/edit_lmstudio.html'
            });
        });

        $('#cardOpenAI').on('click', function () {
            layer.open({
                title: 'OpenAI 配置',
                type: 2,
                shade: 0.2,
                maxmin: true,
                shadeClose: true,
                area: ['100%', '100%'],
                content: '../page/table/edit_gpt.html'
            });
        });

        // Hover 效果
        $('.ai-card').on('mouseenter', function () {
            $(this).css('box-shadow', '0 4px 20px rgba(0,0,0,0.15)');
        }).on('mouseleave', function () {
            $(this).css('box-shadow', '0 2px 12px rgba(0,0,0,0.08)');
        });

        // 配置表单提交
        form.on('submit(submitConfig)', function (data) {
            $.post('../api/save_config.php', data.field, function (res) {
                if (res.code === 0) {
                    layer.msg('保存成功', { icon: 1 });
                } else {
                    layer.msg(res.msg || '保存失败', { icon: 2 });
                }
            }, 'json').fail(function () {
                layer.msg('请求失败', { icon: 2 });
            });
            return false;
        });

        // 默认配置按钮
        $('#btnResetConfig').on('click', function () {
            layer.confirm('确认恢复默认配置？当前配置将被覆盖。', function (index) {
                layer.close(index);
                $.post('../api/reset_config.php', function (res) {
                    if (res.code === 0) {
                        layer.msg('已恢复默认配置', { icon: 1 });
                        setTimeout(function () { location.reload(); }, 800);
                    } else {
                        layer.msg(res.msg || '恢复失败', { icon: 2 });
                    }
                }, 'json').fail(function () {
                    layer.msg('请求失败', { icon: 2 });
                });
            });
        });

        //表单初始赋值
        form.val('example', {
            "username": "贤心" // "name": "value"
            , "password": "123456"
            , "interest": 1
            , "like[write]": true //复选框选中状态
            , "close": true //开关状态
            , "sex": "女"
            , "desc": "我爱 layui"
        })


    });
</script>

</body>
</html>
