<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>守藏 — 新增员工</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="../../lib/layui-v2.6.3/css/layui.css" media="all">
    <link rel="stylesheet" href="../../css/public.css" media="all">
    <style>
        body {
            background-color: #ffffff;
        }
    </style>
</head>
<body>
<div class="layui-form layuimini-form">
    <div class="layui-form-item">
        <label class="layui-form-label required">工号</label>
        <div class="layui-input-block">
            <input type="text" name="number" lay-verify="required" lay-reqtext="工号不能为空" placeholder="请输入工号" value="" class="layui-input">
            <tip>填写新员工工号，请注意工号应唯一。</tip>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label required">ip</label>
        <div class="layui-input-block">
            <input type="text" name="ip" lay-verify="required"  placeholder="请输ip地址" value="" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label required">所属部门</label>
        <div class="layui-input-block">
            <input type="text" name="department"  placeholder="请输员工部门" value="" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">姓名</label>
        <div class="layui-input-block">
            <input type="email" name="name" lay-verify="required" placeholder="请输入姓名" value="" class="layui-input">
        </div>
    </div>
    <div style="text-align: center;">
        <button type="submit" lay-submit lay-filter="saveBtn" class="layui-btn layui-bg-blue">提交</button>
    </div>
</div>
<script src="../../lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
<script>
    layui.use(['form'], function () {
        var form = layui.form,
            layer = layui.layer,
            $ = layui.$;

        //监听提交
        form.on('submit(saveBtn)', function (data) {
            fetch('/api/employees', {
                method: 'POST',
                 headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data.field)
            })
            .then(function (res) { return res.json(); })
            .then(function (result) {
                if (result.code === 0) {
                    layer.msg('保存成功', { icon: 1 }, function () {
                        var iframeIndex = parent.layer.getFrameIndex(window.name);
                        parent.layer.close(iframeIndex);
                    });
                } else {
                    layer.msg(result.msg || '保存失败', { icon: 2 });
                }
            })
            .catch(function () {
                layer.msg('请求失败', { icon: 2 });
            });

            return false;
        });

    });
</script>
</body>
</html>
