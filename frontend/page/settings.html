<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>守藏 — 系统设置</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="../lib/layui-v2.6.3/css/layui.css" media="all">
    <link rel="stylesheet" href="../css/public.css" media="all">
</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">

        <blockquote class="layui-elem-quote layui-text">
            数据库连接配置 — 修改后需重启系统生效
        </blockquote>

        <form class="layui-form" lay-filter="dbConfigForm">

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
            <legend>MySQL 连接设置</legend>
        </fieldset>

        <div class="layui-form-item">
            <label class="layui-form-label required">主机地址</label>
            <div class="layui-input-block">
                <input type="text" name="host" lay-verify="required" class="layui-input" placeholder="localhost">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label required">端口</label>
            <div class="layui-input-block">
                <input type="number" name="port" lay-verify="required|number" class="layui-input" placeholder="3306">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label required">用户名</label>
            <div class="layui-input-block">
                <input type="text" name="user" lay-verify="required" class="layui-input" placeholder="root">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label required">密码</label>
            <div class="layui-input-block">
                <input type="password" name="password" lay-verify="required" class="layui-input" placeholder="请输入数据库密码">
            </div>
        </div>


        <div style="text-align:center; margin-top:30px; margin-bottom:20px;">
            <button class="layui-btn" lay-submit lay-filter="submitDbConfig">保存配置</button>
            <button class="layui-btn layui-btn-primary" id="btnResetDbConfig" type="button">恢复默认</button>
        </div>

        </form>
        
    </div>
</div>

<script src="../lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
<script>
    layui.use(['form'], function () {
        var form = layui.form
            , layer = layui.layer;

        var $ = layui.$;

        // 加载当前数据库配置并预填表单
        $.getJSON('/api/config/database', function (resp) {
            if (resp.code === 0 && resp.data) {
                form.val('dbConfigForm', resp.data);
            }
        }).fail(function () {
            layer.msg('加载数据库配置失败', { icon: 2 });
        });

        // 表单提交
        form.on('submit(submitDbConfig)', function (data) {
            $.ajax({
                url: '/api/config/database',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data.field),
                success: function (res) {
                    if (res.code === 0) {
                        layer.msg(res.msg || '保存成功', { icon: 1 });
                    } else {
                        layer.msg(res.msg || '保存失败', { icon: 2 });
                    }
                },
                error: function () {
                    layer.msg('请求失败', { icon: 2 });
                }
            });
            return false;
        });

        // 恢复默认按钮
        $('#btnResetDbConfig').on('click', function () {
            layer.confirm('确认恢复数据库默认配置？', function (index) {
                layer.close(index);
                $.post('/api/config/reset', function (res) {
                    if (res.code === 0) {
                        layer.msg('已恢复默认配置', { icon: 1 });
                        setTimeout(function () { location.reload(); }, 800);
                    } else {
                        layer.msg(res.msg || '恢复失败', { icon: 2 });
                    }
                }, 'json').fail(function () {
                    layer.msg('请求失败', { icon: 2 });
                });
            });
        });

    });
</script>

</body>
</html>
