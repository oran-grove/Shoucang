<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>守藏 — 账户管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="../lib/layui-v2.6.3/css/layui.css" media="all">
    <link rel="stylesheet" href="../css/public.css" media="all">
</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">

        <blockquote class="layui-elem-quote layui-text">
            管理员账户设置 — 修改后立即生效
        </blockquote>

        <form class="layui-form" lay-filter="accountForm">

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
            <legend>账户信息</legend>
        </fieldset>

        <div class="layui-form-item">
            <label class="layui-form-label required">用户名</label>
            <div class="layui-input-block">
                <input type="text" name="username" lay-verify="required" class="layui-input" id="inputUsername">
            </div>
        </div>

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
            <legend>修改密码</legend>
        </fieldset>

        <div class="layui-form-item">
            <label class="layui-form-label">当前密码</label>
            <div class="layui-input-block">
                <input type="password" name="current_password" class="layui-input" placeholder="不修改密码则留空">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">新密码</label>
            <div class="layui-input-block">
                <input type="password" name="new_password" class="layui-input" placeholder="至少 6 位">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">确认密码</label>
            <div class="layui-input-block">
                <input type="password" name="confirm_password" class="layui-input" placeholder="再次输入新密码">
            </div>
        </div>

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
            <legend>登录有效期</legend>
        </fieldset>

        <div class="layui-form-item">
            <label class="layui-form-label">过期时间</label>
            <div class="layui-input-block">
                <select name="jwt_expiry_hours">
                    <option value="6">6 小时</option>
                    <option value="12">12 小时</option>
                    <option value="24" selected>24 小时</option>
                    <option value="72">3 天</option>
                    <option value="168">7 天</option>
                </select>
            </div>
        </div>

        <div style="text-align:center; margin-top:30px; margin-bottom:20px;">
            <button class="layui-btn" lay-submit lay-filter="submitAccount">保存设置</button>
        </div>

        </form>

    </div>
</div>

<script src="../lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
<script>
    layui.use(['form'], function () {
        var form = layui.form,
            layer = layui.layer,
            $ = layui.$;

        // 加载当前设置并预填表单
        $.getJSON('/api/config', function (resp) {
            if (resp.code === 0 && resp.data && resp.data.webui_auth) {
                var a = resp.data.webui_auth;
                if (a.admin_user) $('#inputUsername').val(a.admin_user);
                if (a.jwt_expiry_hours) {
                    $('select[name=jwt_expiry_hours]').val(String(a.jwt_expiry_hours));
                    form.render('select');
                }
            }
        });

        // 表单提交
        form.on('submit(submitAccount)', function (data) {
            var f = data.field;

            // 修改密码时校验
            if (f.new_password || f.confirm_password) {
                if (!f.current_password) {
                    layer.msg('修改密码需要输入当前密码');
                    return false;
                }
                if (f.new_password.length < 6) {
                    layer.msg('新密码至少 6 位');
                    return false;
                }
                if (f.new_password !== f.confirm_password) {
                    layer.msg('两次输入的密码不一致');
                    return false;
                }
            }

            var payload = {
                username: f.username,
                jwt_expiry_hours: parseInt(f.jwt_expiry_hours) || 0
            };
            if (f.new_password) {
                payload.current_password = f.current_password;
                payload.new_password = f.new_password;
            }

            $.ajax({
                url: '/api/auth/update-account',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function (res) {
                    if (res.code === 0) {
                        localStorage.setItem('username', f.username);
                        if (f.new_password) {
                            $('input[name=current_password]').val('');
                            $('input[name=new_password]').val('');
                            $('input[name=confirm_password]').val('');
                        }
                        layer.msg(res.msg, { icon: 1 });
                    } else {
                        layer.msg(res.msg, { icon: 2 });
                    }
                },
                error: function () {
                    layer.msg('保存失败，请重试', { icon: 2 });
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
