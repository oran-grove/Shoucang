<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>GPT 配置</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="../../lib/layui-v2.6.3/css/layui.css" media="all">
    <link rel="stylesheet" href="../../css/public.css" media="all">
    <style>
        body {
            background-color: #ffffff;
        }
    </style>
</head>
<body>
<div class="layui-form layuimini-form">
    <input type="hidden" name="original_number" id="original_number" value="">

    <div class="layui-form-item">
        <label class="layui-form-label required">API密钥</label>
        <div class="layui-input-block">
            <input type="text" name="api_key" lay-verify="required"  value="" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label required">模型名称</label>
        <div class="layui-input-block">
            <input type="text" name="model_name" lay-verify="required" value="" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block">
            <button class="layui-btn layui-btn-normal" lay-submit lay-filter="saveBtn">确认保存</button>
        </div>
    </div>
</div>
</div>
<script src="../../lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
<script>
    layui.use(['form'], function () {
        var form = layui.form,
            layer = layui.layer,
            $ = layui.$;

        // 加载当前 OpenAI 配置并回填表单
        $.getJSON('/api/config', function (resp) {
            var config = resp.data || resp;
            if (config.backends && config.backends.openai) {
                $('input[name="api_key"]').val(config.backends.openai.api_key || '');
                $('input[name="model_name"]').val(config.backends.openai.model_name || '');
            }
        }).fail(function () {
            layer.msg('加载配置失败', { icon: 2 });
        });

        // 监听提交
        form.on('submit(saveBtn)', function (data) {
            var payload = {
                backend: 'openai',
                api_key: data.field.api_key,
                model_name: data.field.model_name
            };
            $.ajax({
                url: '/api/config/backend',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function (res) {
                    if (res.code === 0) {
                        layer.msg('保存成功', { icon: 1 }, function () {
                            var iframeIndex = parent.layer.getFrameIndex(window.name);
                            parent.layer.close(iframeIndex);
                            parent.location.reload();
                        });
                    } else {
                        layer.msg(res.msg || '保存失败', { icon: 2 });
                    }
                },
                error: function () {
                    layer.msg('请求失败', { icon: 2 });
                }
            });
            return false;
        });

    });
</script>
</body>
</html>
