<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>编辑员工</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="../../lib/layui-v2.6.3/css/layui.css" media="all">
    <link rel="stylesheet" href="../../css/public.css" media="all">
    <style>
        body {
            background-color: #ffffff;
        }
    </style>
</head>
<body>
<div class="layui-form layuimini-form">
    <input type="hidden" name="original_number" id="original_number" value="">

    <div class="layui-form-item">
        <label class="layui-form-label required">工号</label>
        <div class="layui-input-block">
            <input type="text" name="number" lay-verify="required" lay-reqtext="工号不能为空" value="" class="layui-input">
            <tip>填写员工工号。</tip>
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label required">员工姓名</label>
        <div class="layui-input-block">
            <input type="text" name="name" lay-verify="required" value="" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">部门</label>
        <div class="layui-input-block">
            <input type="text" name="department" value="" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">ip地址</label>
        <div class="layui-input-block">
            <input type="text" name="ip"  value="" class="layui-input">
        </div>
    </div>

    <div class="layui-form-item">
        <div class="layui-input-block">
            <button class="layui-btn layui-btn-normal" lay-submit lay-filter="saveBtn">确认保存</button>
        </div>
    </div>
</div>
</div>
<script src="../../lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
<script>
    // 从 URL 参数读取原始数据并回填表单
    function getQueryParams() {
        var params = {};
        var search = window.location.search.substring(1);
        if (search) {
            var pairs = search.split('&');
            for (var i = 0; i < pairs.length; i++) {
                var kv = pairs[i].split('=');
                params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
            }
        }
        return params;
    }

    var originalData = getQueryParams();

    layui.use(['form'], function () {
        var form = layui.form,
            layer = layui.layer,
            $ = layui.$;

        // 回填表单
        if (originalData.number) {
            $('#original_number').val(originalData.number);
            $('input[name="number"]').val(originalData.number || '');
            $('input[name="name"]').val(originalData.name || '');
            $('input[name="department"]').val(originalData.department || '');
            $('input[name="ip"]').val(originalData.ip || '');
        }

        //监听提交
        form.on('submit(saveBtn)', function (data) {
            var payload = {
                original: { number: $('#original_number').val() },
                updated: data.field
            };
            // 清理掉隐藏字段，不写入数据
            delete payload.updated.original_number;

            fetch('update.php', {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(function (res) { return res.json(); })
            .then(function (result) {
                if (result.code === 0) {
                    layer.msg('更新成功', { icon: 1 }, function () {
                        var iframeIndex = parent.layer.getFrameIndex(window.name);
                        parent.layer.close(iframeIndex);
                        parent.location.reload(); // 刷新父页面表格
                    });
                } else {
                    layer.msg(result.msg || '更新失败', { icon: 2 });
                }
            })
            .catch(function (err) {
                layer.msg('请求失败: ' + err.message, { icon: 2 });
            });

            return false;
        });

    });
</script>
</body>
</html>
