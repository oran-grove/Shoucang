<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>守藏 — 智能体配置</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="../lib/layui-v2.6.3/css/layui.css" media="all">
    <link rel="stylesheet" href="../css/public.css" media="all">
</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">

        <div>
            <div class="layui-row layui-col-space15" style="margin-bottom: 20px;">
                <div class="layui-col-md4">
                    <div class="ai-card" id="cardDeepSeek" style="cursor:pointer; padding:24px; border-radius:8px; text-align:center; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,0.08); transition: box-shadow .3s;">
                        <svg width="48" height="48" viewBox="0 0 48 48" style="margin-bottom:12px;">
                            <circle cx="24" cy="24" r="22" fill="#4F46E5" opacity="0.12"/>
                            <path d="M16 16 L24 8 L32 16 L28 16 L28 24 L32 24 L24 32 L16 24 L20 24 L20 16Z" fill="#4F46E5"/>
                        </svg>
                        <h3 style="margin:0 0 6px 0; font-size:16px; color:#333;">DeepSeek</h3>
                        <p style="margin:0; font-size:13px; color:#999;">DeepSeek API 配置</p>
                    </div>
                </div>
                <div class="layui-col-md4">
                    <div class="ai-card" id="cardLMStudio" style="cursor:pointer; padding:24px; border-radius:8px; text-align:center; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,0.08); transition: box-shadow .3s;">
                        <svg width="48" height="48" viewBox="0 0 48 48" style="margin-bottom:12px;">
                            <rect x="6" y="10" width="36" height="28" rx="4" fill="#7C3AED" opacity="0.12"/>
                            <rect x="10" y="14" width="12" height="8" rx="2" fill="#7C3AED"/>
                            <rect x="26" y="14" width="12" height="8" rx="2" fill="#7C3AED"/>
                            <rect x="10" y="26" width="8" height="8" rx="2" fill="#7C3AED"/>
                            <rect x="22" y="26" width="16" height="8" rx="2" fill="#7C3AED"/>
                        </svg>
                        <h3 style="margin:0 0 6px 0; font-size:16px; color:#333;">LM Studio</h3>
                        <p style="margin:0; font-size:13px; color:#999;">本地模型服务配置</p>
                    </div>
                </div>
                <div class="layui-col-md4">
                    <div class="ai-card" id="cardOpenAI" style="cursor:pointer; padding:24px; border-radius:8px; text-align:center; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,0.08); transition: box-shadow .3s;">
                        <svg width="48" height="48" viewBox="0 0 48 48" style="margin-bottom:12px;">
                            <circle cx="24" cy="24" r="22" fill="#10A37F" opacity="0.12"/>
                            <path d="M24 6 C20 14 16 18 8 20 C16 22 20 28 24 36 C28 28 32 22 40 20 C32 18 28 14 24 6Z" fill="#10A37F"/>
                        </svg>
                        <h3 style="margin:0 0 6px 0; font-size:16px; color:#333;">OpenAI</h3>
                        <p style="margin:0; font-size:13px; color:#999;">ChatGPT API 配置</p>
                    </div>
                </div>
            </div>
        </div>
        
        <blockquote class="layui-elem-quote layui-text">
        "请谨慎填写"
        </blockquote>

        <form class="layui-form" lay-filter="configForm">

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
            <legend>Layer 1 — 筛查智能体 (screening)</legend>
        </fieldset>

        <div class="layui-form-item">
            <label class="layui-form-label">后端模型</label>
            <div class="layui-input-block">
                <input type="text" name="screening[backend]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">模型名称</label>
            <div class="layui-input-block">
                <input type="text" name="screening[model_name]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">温度参数</label>
            <div class="layui-input-block">
                <input type="number" name="screening[temperature]" step="0.1" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">最大Token数</label>
            <div class="layui-input-block">
                <input type="number" name="screening[max_tokens]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">恶意置信度阈值</label>
            <div class="layui-input-block">
                <input type="number" name="screening[confidence_threshold_dangerous]" step="0.01" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">可疑置信度阈值</label>
            <div class="layui-input-block">
                <input type="number" name="screening[confidence_threshold_suspicious]" step="0.01" class="layui-input">
            </div>
        </div>

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
            <legend>Layer 2 — 回溯智能体 (backtrack)</legend>
        </fieldset>

        <div class="layui-form-item">
            <label class="layui-form-label">后端模型</label>
            <div class="layui-input-block">
                <input type="text" name="backtrack[backend]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">模型名称</label>
            <div class="layui-input-block">
                <input type="text" name="backtrack[model_name]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">温度参数</label>
            <div class="layui-input-block">
                <input type="number" name="backtrack[temperature]" step="0.1" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">最大Token数</label>
            <div class="layui-input-block">
                <input type="number" name="backtrack[max_tokens]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">关联度阈值</label>
            <div class="layui-input-block">
                <input type="number" name="backtrack[relevance_threshold]" step="0.01" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">分批上下文比例</label>
            <div class="layui-input-block">
                <input type="number" name="backtrack[batch_context_ratio]" step="0.001" class="layui-input">
            </div>
        </div>

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
            <legend>Layer 3 — 研判智能体 (adjudication)</legend>
        </fieldset>

        <div class="layui-form-item">
            <label class="layui-form-label">后端模型</label>
            <div class="layui-input-block">
                <input type="text" name="adjudication[backend]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">模型名称</label>
            <div class="layui-input-block">
                <input type="text" name="adjudication[model_name]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">温度参数</label>
            <div class="layui-input-block">
                <input type="number" name="adjudication[temperature]" step="0.1" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">最大Token数</label>
            <div class="layui-input-block">
                <input type="number" name="adjudication[max_tokens]" class="layui-input">
            </div>
        </div>

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 30px;">
            <legend>反馈智能体 (feedback)</legend>
        </fieldset>

        <div class="layui-form-item">
            <label class="layui-form-label">后端模型</label>
            <div class="layui-input-block">
                <input type="text" name="feedback[backend]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">模型名称</label>
            <div class="layui-input-block">
                <input type="text" name="feedback[model_name]" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">温度参数</label>
            <div class="layui-input-block">
                <input type="number" name="feedback[temperature]" step="0.1" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">最大Token数</label>
            <div class="layui-input-block">
                <input type="number" name="feedback[max_tokens]" class="layui-input">
            </div>
        </div>

        <div style="text-align:center; margin-top:30px; margin-bottom:20px;">
            <button class="layui-btn" lay-submit lay-filter="submitConfig">保存配置</button>
            <button class="layui-btn layui-btn-primary" id="btnResetConfig" type="button">默认配置</button>
        </div>

        </form>
        
    </div>
</div>

<script src="../lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
<script>
    layui.use(['form'], function () {
        var form = layui.form
            , layer = layui.layer;
        var $ = layui.$;

        // 加载配置并填充表单
        $.getJSON('/api/config', function (resp) {
            var config = resp.data || resp;
            ['screening', 'backtrack', 'adjudication', 'feedback'].forEach(function (section) {
                var data = config[section];
                if (data) {
                    for (var key in data) {
                        $('input[name="' + section + '[' + key + ']"]').val(data[key]);
                    }
                }
            });
            form.render(null, 'configForm');
        }).fail(function () {
            layer.msg('加载配置失败', { icon: 2 });
        });

        // 卡片点击事件
        $('#cardDeepSeek').on('click', function () {
            layer.open({
                title: 'DeepSeek 配置',
                type: 2,
                shade: 0.2,
                maxmin: true,
                shadeClose: true,
                area: ['100%', '100%'],
                content: '/page/backend-deepseek.html'
            });
        });

        $('#cardLMStudio').on('click', function () {
            layer.open({
                title: 'LM Studio 配置',
                type: 2,
                shade: 0.2,
                maxmin: true,
                shadeClose: true,
                area: ['100%', '100%'],
                content: '/page/backend-lmstudio.html'
            });
        });

        $('#cardOpenAI').on('click', function () {
            layer.open({
                title: 'OpenAI 配置',
                type: 2,
                shade: 0.2,
                maxmin: true,
                shadeClose: true,
                area: ['100%', '100%'],
                content: '/page/backend-openai.html'
            });
        });

        // Hover 效果
        $('.ai-card').on('mouseenter', function () {
            $(this).css('box-shadow', '0 4px 20px rgba(0,0,0,0.15)');
        }).on('mouseleave', function () {
            $(this).css('box-shadow', '0 2px 12px rgba(0,0,0,0.08)');
        });

        // 配置表单提交
        form.on('submit(submitConfig)', function (data) {
            // 将 layui 扁平 key（如 "screening[backend]"）转为嵌套结构
            var raw = data.field;
            var config = {};
            for (var key in raw) {
                if (!raw.hasOwnProperty(key)) continue;
                var val = raw[key];
                // 空字符串视为不修改
                if (val === '') continue;
                var match = key.match(/^(\w+)\[(\w+)\]$/);
                if (match) {
                    if (!config[match[1]]) config[match[1]] = {};
                    config[match[1]][match[2]] = val;
                }
            }
            $.ajax({
                url: '/api/config',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({config: config}),
                success: function (res) {
                    if (res.code === 0) {
                        layer.msg('保存成功', { icon: 1 });
                    } else {
                        layer.msg(res.msg || '保存失败', { icon: 2 });
                    }
                },
                error: function () {
                    layer.msg('请求失败', { icon: 2 });
                }
            });
            return false;
        });

        // 默认配置按钮 — 仅重置当前页面管理的智能体配置节
        $('#btnResetConfig').on('click', function () {
            layer.confirm(
                '确认恢复智能体配置为默认值？数据库配置和后端 API 密钥不受影响。',
                function (index) {
                    layer.close(index);
                    $.ajax({
                        url: '/api/config/reset',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({
                            sections: ['screening', 'backtrack', 'adjudication', 'feedback']
                        }),
                        success: function (res) {
                            if (res.code === 0) {
                                layer.msg('已恢复默认配置', { icon: 1 });
                                setTimeout(function () { location.reload(); }, 800);
                            } else {
                                layer.msg(res.msg || '恢复失败', { icon: 2 });
                            }
                        },
                        error: function () {
                            layer.msg('请求失败', { icon: 2 });
                        }
                    });
                }
            );
        });});
</script>

</body>
</html>
